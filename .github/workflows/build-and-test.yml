name: Build and Test

on:
  push:
    branches:
      - '**'
      - '!main'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'corretto'
  XCODE_VERSION: '26.3'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: ${{env.JAVA_DISTRIBUTION}}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Set up XCode
        if: matrix.os == 'macos-latest'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Run static analysis
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew ktfmtCheck detekt

      - name: Build and test non-Apple
        if: matrix.os == 'ubuntu-latest'
        run: ./gradlew build -x ktfmtCheck -x detekt

      - name: Build and test Apple
        if: matrix.os == 'macos-latest'
        run: ./gradlew macosX64Test macosArm64Test iosX64Test iosSimulatorArm64Test

      - name: Build and test Windows
        if: matrix.os == 'windows-latest'
        run: ./gradlew mingwX64Test

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ matrix.os }}
          path: '**/build/reports'
