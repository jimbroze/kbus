name: Publish Artifacts
on:
  release:
    types: [ published ]
  workflow_call:
    inputs:
      version:
        description: 'The version to publish'
        required: true
        type: string

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'corretto'
  XCODE_VERSION: '26.3'

jobs:
  publish:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: ${{env.JAVA_DISTRIBUTION}}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Set up XCode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Extract Release Version
        id: version
        run: |
          RAW_VERSION="${{ inputs.version || github.event.release.tag_name }}"
          
          # Strip the 'v' prefix if it exists (e.g., v1.0.0 becomes 1.0.0)
          SAFE_VERSION="${RAW_VERSION#v}"
          
          echo "VERSION=$SAFE_VERSION" >> $GITHUB_ENV

      - name: Publish To Maven Central
        env:
          VERSION_OVERRIDE: ${{ env.VERSION }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
